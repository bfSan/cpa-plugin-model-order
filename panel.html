<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>模型排序</title>
<style>
/* Theme tokens shared with the CPA management panel and the sibling plugin
   panels (workbuddy / qoder / cline). The theme is chosen by a data-theme
   attribute on <html> so an embedded iframe can follow the CPA parent, which a
   bare prefers-color-scheme query cannot do. */
:root{
  --bg:#faf9f5;--card:#ffffff;--border:#e3e1db;--fg:#2d2a26;--mut:#6d6760;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#10b981;--warn:#e0aa14;--err:#c65746;
  --surface:#f0eee8;--surface-muted:#e9e6df;--btn-sec:#eef1f6;--btn-sec-hover:#e4e8ef;
  --input-bg:#ffffff;--code-bg:#f3f4f6;--code-fg:#374151;--placeholder:rgba(109,103,96,.55);
  --ok-soft:rgba(16,185,129,.10);--ok-border:rgba(16,185,129,.30);
  --warn-soft:rgba(224,170,20,.12);--warn-border:rgba(224,170,20,.32);
  --err-soft:rgba(198,87,70,.10);--err-border:rgba(198,87,70,.30);
  --mut-soft:rgba(109,103,96,.12);--mut-border:rgba(109,103,96,.28);
  --toast-shadow:0 10px 28px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.04);
  --acc-ring:rgba(76,141,255,.18);--radius-md:12px;--radius-lg:16px;
  color-scheme:light
}
:root[data-theme="white"]{
  --bg:#f5f5f5;--card:#ffffff;--border:#e6e6e6;--fg:#1f1f1f;--mut:#707070;
  --surface:#fafafa;--surface-muted:#efefef;--btn-sec:#f0f0f0;--btn-sec-hover:#e8e8e8;
  --input-bg:#ffffff;--code-bg:#f3f4f6;--code-fg:#374151;--placeholder:rgba(112,112,112,.55);
  --toast-shadow:0 10px 28px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.04);
  color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#1e1d1b;--card:#26241f;--border:#3a3833;--fg:#ede9e3;--mut:#9a948c;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#34d399;--warn:#f0c050;--err:#e07a6a;
  --surface:#2f2d28;--surface-muted:#35332e;--btn-sec:#35332e;--btn-sec-hover:#3f3c36;
  --input-bg:#1e1d1b;--code-bg:#35332e;--code-fg:#d6d1c9;--placeholder:rgba(154,148,140,.55);
  --ok-soft:rgba(52,211,153,.12);--ok-border:rgba(52,211,153,.38);
  --warn-soft:rgba(240,192,80,.14);--warn-border:rgba(240,192,80,.38);
  --err-soft:rgba(224,122,106,.12);--err-border:rgba(224,122,106,.38);
  --mut-soft:rgba(154,148,140,.16);--mut-border:rgba(154,148,140,.32);
  --toast-shadow:0 10px 28px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03);
  --acc-ring:rgba(76,141,255,.28);
  color-scheme:dark
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
code,.name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
header{background:var(--card);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
.ver{color:var(--mut);font-size:12px}
.spacer{flex:1 1 auto}
.actions{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#btnSave{min-width:120px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;grid-column:1/-1}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:16px;max-width:1500px;margin:0 auto}
@media (max-width:980px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
  overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card>h2{margin:0;padding:12px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 .hint{font-weight:400;color:var(--mut);font-size:12px}
.bar{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.body{padding:10px 14px;overflow:auto;max-height:60vh}
.note{color:var(--mut);font-size:12px;padding:8px 14px;border-top:1px solid var(--border);background:var(--surface)}
button{font:inherit;font-size:13px;background:var(--btn-sec);color:var(--fg);border:1px solid var(--border);
  border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--btn-sec-hover)}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
button.primary:hover{filter:brightness(1.05)}
button:focus-visible{outline:2px solid var(--acc-ring);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
button.mini{padding:3px 8px;font-size:12px;line-height:1.4}
input[type=text],input[type=search],input[type=password],select{font:inherit;font-size:13px;
  background:var(--input-bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;
  padding:7px 10px;min-width:0;max-width:100%}
input::placeholder{color:var(--placeholder)}
input.grow{flex:1 1 160px}
label.chk{display:flex;align-items:center;gap:6px;color:var(--mut);user-select:none;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 12px;background:var(--card)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.chip{display:inline-block;background:var(--mut-soft);border:1px solid var(--mut-border);border-radius:99px;
  padding:2px 9px;font-size:11px;font-weight:600;color:var(--mut);white-space:nowrap}
.chip.hit{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-border)}
.chip.none{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-border)}
.row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--border);min-width:0}
.row:last-child{border-bottom:0}
.row input{flex:1 1 120px}
.idx{width:22px;text-align:right;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.name{font-size:12px;overflow-wrap:anywhere;min-width:0}
.empty{color:var(--mut);padding:16px 2px;font-size:13px;text-align:center}
ol.rules,ul.models{margin:0;padding:0;list-style:none}
ul.models li{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--border);min-width:0}
ul.models li:last-child{border-bottom:0}
ul.models li.pick{background:var(--acc-ring);border-radius:6px}
.flag{margin-left:auto;display:flex;gap:4px;opacity:0;transition:opacity .1s;flex:0 0 auto}
ul.models li:hover .flag,li.pick .flag{opacity:1}
#auth{padding:10px 16px;background:var(--warn-soft);border-bottom:1px solid var(--warn-border);
  color:var(--warn);display:none;gap:8px;align-items:center;flex-wrap:wrap}
#toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:9999;max-width:360px}
.toast{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--acc);
  border-radius:var(--radius-md);padding:12px 16px;font-size:13px;box-shadow:var(--toast-shadow);
  transform:translateX(120%);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1.1),opacity .25s;
  cursor:pointer;word-break:break-all}
.toast.show{transform:translateX(0);opacity:1}
.toast.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.toast.err{border-left-color:var(--err);background:var(--err-soft)}
@media (max-width:640px){
  header{padding:10px 12px}main{padding:12px;gap:12px}
  .flag{opacity:1}
}
</style>
<script>
/* Early theme sync: follow the CPA parent theme when embedded, else the OS
   preference. Same semantics as the workbuddy, qoder and cline panels. */
(function(){
  var ATTR="data-theme";
  function embedded(){try{return window.self!==window.top}catch(e){return false}}
  function apply(t){var el=document.documentElement;if(t==="white"||t==="dark")el.setAttribute(ATTR,t);else el.removeAttribute(ATTR)}
  function parentTheme(){
    if(!embedded())return null;
    try{var raw=window.parent.document.documentElement.getAttribute(ATTR);if(raw==="white"||raw==="dark")return raw;return "light"}catch(e){return null}
  }
  function systemTheme(){try{return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){return "light"}}
  function sync(){apply(parentTheme()||systemTheme())}
  sync();
  window.__moThemeSync=function(){
    sync();
    if(!embedded()){
      try{var mq=window.matchMedia("(prefers-color-scheme: dark)");var on=function(){sync()};if(mq.addEventListener)mq.addEventListener("change",on);else if(mq.addListener)mq.addListener(on)}catch(e){}
      return;
    }
    try{
      var parentEl=window.parent.document.documentElement;
      new MutationObserver(sync).observe(parentEl,{attributes:true,attributeFilter:[ATTR]});
      window.addEventListener("storage",function(e){if(e.key==="cli-proxy-theme")sync()});
    }catch(e){}
  };
})();
</script>
</head>
<body>
<header>
  <h1>模型排序</h1><span class="ver" id="ver"></span>
  <div class="seg" id="strategy">
    <button data-v="grouped" title="聚合预设在前,其余按规则分组">分组</button>
    <button data-v="name" title="整份列表按模型 ID 字母序">纯字母序</button>
  </div>
  <label class="chk"><input type="checkbox" id="cs">区分大小写</label>
  <span class="chip" id="src">未配置</span>
</header>

<div id="auth">
  <span>需要 CPA 管理密钥</span>
  <input type="password" class="grow" id="keyInput" placeholder="remote-management.secret-key" autocomplete="off">
  <button onclick="saveKey()">确定</button>
  <button class="mini" onclick="suppressKey()">本次不用</button>
</div>

<main>
  <!-- Actions live in the page, not the header: CPA floats its own toolbar at the
       top right of the frame, and a right aligned sticky cluster landed under it. -->
  <div class="actions" id="actions">
    <button id="btnDefault">载入推荐模板</button>
    <button id="btnGen">按预览生成精确规则</button>
    <button class="primary" id="btnSave">保存并生效</button>
  </div>
  <section class="card">
    <h2>排序规则 order <span class="hint">从上到下匹配,先命中先入组;留空即不分组,全部字母序</span></h2>
    <div class="bar">
      <input type="text" class="grow" id="newPattern" placeholder="模型 ID 或通配,如 gpt-* / *-auto / *kimi*">
      <button id="btnAdd">添加</button>
      <button class="mini" id="btnTop" title="添加到最前面">置顶</button>
    </div>
    <div class="body"><ol class="rules" id="rules"></ol></div>
    <div class="note">每条规则各成一桶,桶内按模型 ID 字母序。未命中任何规则的模型排在最后,同样按字母序。</div>
  </section>

  <section class="card">
    <h2>CPA 实际下发的模型 <span class="hint" id="capHint"></span></h2>
    <div class="bar">
      <select id="port"></select>
      <input type="search" class="grow" id="filter" placeholder="筛选模型 ID">
      <span class="chip" id="cnt"></span>
    </div>
    <div class="body"><ul class="models" id="models"></ul></div>
    <div class="note">这里列出的是各端口真实收到的 ID。Anthropic 端口是伪装名,想单独控制它就直接点右侧的“精确”,把伪装 ID 写成规则。</div>
  </section>

  <section class="card" style="grid-column:1/-1">
    <h2>预览 <span class="hint">用未保存的规则实时计算,排序与插件运行时同一套代码</span>
      <span class="spacer"></span><span class="chip" id="pvPort"></span></h2>
    <div class="bar">
      <button class="mini" id="pvUp" title="上移选中项">↑</button>
      <button class="mini" id="pvDown" title="下移选中项">↓</button>
      <button class="mini" id="pvHome" title="移到最前">移顶</button>
      <span class="hint">选中一行后可手工微调,再点顶部“按预览生成精确规则”</span>
    </div>
    <div class="body"><ul class="models" id="preview"></ul></div>
  </section>
</main>

<div id="toasts"></div>

<footer class="note" style="border-top:0;background:transparent;text-align:center;padding:4px 16px 20px">
  管理接口：<code id="apiPath"></code>
</footer>

<script>
// The host injects a quoted JS literal here, so the placeholder must not sit
// inside its own quotes.
const MANAGEMENT_BASE_PATH = __MO_MANAGEMENT_BASE_PATH_JSON__;
const API = MANAGEMENT_BASE_PATH + "/plugins/model-order";
const PLUGIN_CONFIG_PATH = MANAGEMENT_BASE_PATH + "/plugins/model-order/config";

/* ---- 管理密钥: URL ?key= > sessionStorage > CPA 主面板 localStorage ---- */
const ENC_PREFIX = "enc::v1::";
const SECRET_SALT = "cli-proxy-api-webui::secure-storage";
const PANEL_STORE = "cli-proxy-auth";
const SS_KEY = "model-order-mgmt-key";
let keySuppressed = false;

const readSessionKey = () => keySuppressed ? null : (() => { try { return sessionStorage.getItem(SS_KEY); } catch (_) { return null; } })();
const storeSessionKey = k => { try { sessionStorage.setItem(SS_KEY, k); keySuppressed = false; return true; } catch (_) { return false; } };
function deobfuscate(p){
  if(!p || !p.startsWith(ENC_PREFIX)) return p;
  try{
    const bytes = new TextEncoder().encode(SECRET_SALT + "|" + location.host + "|" + navigator.userAgent);
    const bin = atob(p.slice(ENC_PREFIX.length));
    const out = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i) ^ bytes[i % bytes.length];
    return new TextDecoder().decode(out);
  }catch(_){ return p; }
}
function readPanelKey(){
  try { if (window.self === window.top) return null; } catch (_) { return null; }
  let raw; try { raw = localStorage.getItem(PANEL_STORE); } catch (_) { return null; }
  if (!raw) return null;
  try{
    const parsed = JSON.parse(deobfuscate(raw));
    const st = (parsed && parsed.state) || parsed || {};
    return typeof st.managementKey === "string" && st.managementKey ? st.managementKey : null;
  }catch(_){ return null; }
}
(function captureUrlKey(){
  const url = new URL(location.href);
  const k = url.searchParams.get("key");
  if (!k) return;
  storeSessionKey(k);
  url.searchParams.delete("key");
  history.replaceState(null, "", url.pathname + url.search + url.hash);
})();
const getKey = () => readSessionKey() || readPanelKey();
function saveKey(){
  const v = document.getElementById("keyInput").value.trim();
  if (!v) return;
  if (!storeSessionKey(v)) { showAuth(); return; }
  document.getElementById("auth").style.display = "none";
  boot();
}
function suppressKey(){ keySuppressed = true; try { sessionStorage.removeItem(SS_KEY); } catch (_) {} document.getElementById("auth").style.display = "none"; }
function showAuth(){ const el = document.getElementById("auth"); el.style.display = "flex"; const i = document.getElementById("keyInput"); if (i) i.focus(); }
const authHeaders = k => k ? { "Authorization": "Bearer " + k } : {};

async function call(path, opts = {}){
  const k = getKey();
  if (!k) { showAuth(); throw new Error("需要管理密钥"); }
  const r = await fetch(path, { ...opts, credentials: "omit", headers: { ...(opts.headers || {}), ...authHeaders(k) } });
  if (r.status === 401 || r.status === 403) { showAuth(); throw new Error("管理密钥无效"); }
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) { throw new Error("响应不是 JSON: " + text.slice(0, 120)); }
  if (!r.ok) throw new Error((data && (data.message || data.error)) || ("HTTP " + r.status));
  return data;
}

function toast(kind, msg){
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast" + (kind === "err" ? " err" : kind === "ok" ? " ok" : "");
  el.textContent = msg;
  box.appendChild(el);
  // The shared panel toast style animates in through .show, so the class has to
  // land a frame after insertion. Clicking dismisses early, as in the siblings.
  requestAnimationFrame(() => el.classList.add("show"));
  const life = setTimeout(dismiss, kind === "err" ? 6000 : 3200);
  function dismiss(){ clearTimeout(life); el.remove(); }
  el.addEventListener("click", dismiss);
}

/* ---- 状态 ---- */
let state = { strategy: "grouped", caseSensitive: false, order: [], configured: false, suggestedOrder: [], catalogs: [] };
let port = "";
let dirty = false;
let previewIds = [];
let previewSel = -1;
let previewTimer = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function markDirty(){
  dirty = true;
  $("src").textContent = "有未保存的修改";
  $("src").className = "chip none";
}
function markClean(configured){
  dirty = false;
  $("src").textContent = configured ? "来自配置" : "未配置(不分组)";
  $("src").className = "chip" + (configured ? " hit" : " none");
}

async function load(){
  const d = await call(API + "/status");
  state.strategy = d.strategy || "grouped";
  state.caseSensitive = !!d.case_sensitive;
  state.order = Array.isArray(d.order) ? d.order.slice() : [];
  state.configured = !!d.configured;
  state.suggestedOrder = Array.isArray(d.suggested_order) ? d.suggested_order.slice() : [];
  state.catalogs = Array.isArray(d.catalogs) ? d.catalogs : [];
  $("ver").textContent = "v" + (d.version || "?");
  if (!port || !state.catalogs.some(c => c.port === port)) {
    port = state.catalogs.length ? state.catalogs[0].port : "";
  }
  renderAll();
  markClean(state.configured);
}

function renderAll(){
  // 策略分段
  document.querySelectorAll("#strategy button").forEach(b => b.classList.toggle("on", b.dataset.v === state.strategy));
  $("cs").checked = state.caseSensitive;
  renderPorts();
  renderRules();
  renderModels();
  schedulePreview(0);
}

function renderPorts(){
  const sel = $("port");
  sel.innerHTML = state.catalogs.map(c => `<option value="${esc(c.port)}">${esc(c.port)} (${c.count})</option>`).join("");
  if (port) sel.value = port;
  const cap = state.catalogs.find(c => c.port === port);
  $("capHint").textContent = cap ? `捕获于 ${new Date(cap.seen_at).toLocaleTimeString()}` : "尚无捕获";
  $("pvPort").textContent = port ? "端口 " + port : "无数据";
}

function currentCatalog(){ return state.catalogs.find(c => c.port === port) || { entries: [] }; }

function renderRules(){
  const box = $("rules");
  if (!state.order.length) {
    box.innerHTML = `<li class="empty">没有规则,所以当前不分组,整份列表按模型 ID 字母序。要分组就加规则,或点“载入推荐模板”。</li>`;
    return;
  }
  const ids = currentCatalog().entries.map(e => e.id);
  box.innerHTML = state.order.map((p, i) => {
    const hits = ids.filter(id => testPattern(p, id, state.caseSensitive)).length;
    return `<li class="row">
      <span class="idx">${i + 1}</span>
      <input type="text" class="grow" value="${esc(p)}" data-i="${i}">
      <span class="chip ${hits ? "hit" : "none"}" title="命中当前端口模型数">${hits}</span>
      <button class="mini" data-act="up" data-i="${i}" ${i === 0 ? "disabled" : ""}>↑</button>
      <button class="mini" data-act="down" data-i="${i}" ${i === state.order.length - 1 ? "disabled" : ""}>↓</button>
      <button class="mini" data-act="del" data-i="${i}">删</button>
    </li>`;
  }).join("");
}

function renderModels(){
  const q = $("filter").value.trim().toLowerCase();
  const entries = currentCatalog().entries.filter(e => !q || e.id.toLowerCase().includes(q));
  $("cnt").textContent = entries.length + " / " + (currentCatalog().count || 0);
  const box = $("models");
  if (!entries.length) {
    box.innerHTML = `<li class="empty">先用任一客户端拉一次模型列表,插件会在此处记下 CPA 真实下发的 ID。</li>`;
    return;
  }
  box.innerHTML = entries.map(e => {
    const hit = firstRule(e.id);
    return `<li data-id="${esc(e.id)}">
      <span class="name">${esc(e.id)}</span>
      ${e.owned_by ? `<span class="chip">${esc(e.owned_by)}</span>` : ""}
      <span class="chip ${hit ? "hit" : "none"}">${hit ? esc(hit) : "未分组"}</span>
      <span class="flag">
        <button class="mini" data-act="exact" data-id="${esc(e.id)}" title="按这个 ID 建精确规则">精确</button>
        <button class="mini" data-act="prefix" data-id="${esc(e.id)}" title="取 provider 前缀建通配规则">前缀</button>
      </span>
    </li>`;
  }).join("");
}

/* ---- 与插件同款匹配语义: 前缀 / 后缀 / 包含 / 通用 glob / 精确 ---- */
function toReg(pattern){
  const parts = pattern.split("*");
  const lit = parts.map(s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return new RegExp("^" + lit.join("[\\s\\S]*") + "$");
}
function testPattern(pattern, id, caseSensitive){
  if (pattern === "*") return false;
  let p = pattern, s = id;
  if (!caseSensitive) { p = p.toLowerCase(); s = s.toLowerCase(); }
  return toReg(p).test(s);
}
function firstRule(id){
  for (const p of state.order) if (testPattern(p, id, state.caseSensitive)) return p;
  return "";
}
function sortIds(ids, strategy, order, caseSensitive){
  const rules = order.filter(p => p && p.trim() && p.trim() !== "*")
    .map(p => ({ p: caseSensitive ? p : p.toLowerCase(), re: toReg(caseSensitive ? p : p.toLowerCase()) }));
  const rank = id => {
    const s = caseSensitive ? id : id.toLowerCase();
    for (let i = 0; i < rules.length; i++) if (rules[i].re.test(s)) return i;
    return rules.length;
  };
  const cmp = (a, b) => {
    if (strategy !== "name" && rules.length) {
      const ra = rank(a), rb = rank(b);
      if (ra !== rb) return ra - rb;
    }
    const la = a.toLowerCase(), lb = b.toLowerCase();
    if (la !== lb) return la < lb ? -1 : 1;
    return a < b ? -1 : a > b ? 1 : 0;
  };
  return ids.slice().sort(cmp);
}

/* ---- 预览 ---- */
function schedulePreview(ms){
  clearTimeout(previewTimer);
  previewTimer = setTimeout(renderPreview, ms === undefined ? 220 : ms);
}
async function renderPreview(){
  const cap = currentCatalog();
  const box = $("preview");
  if (!cap.entries.length) { box.innerHTML = `<li class="empty">无模型数据</li>`; return; }
  let ordered;
  try {
    const d = await call(API + "/preview", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ strategy: state.strategy, order: state.order, case_sensitive: state.caseSensitive, port })
    });
    ordered = d.ordered || [];
  } catch (e) {
    // 后端不可用时退回本地等价实现,保证编辑过程看得见结果
    ordered = sortIds(cap.entries.map(e => e.id), state.strategy, state.order, state.caseSensitive);
    if (getKey()) toast("err", "预览接口失败,已用本地计算: " + e.message);
  }
  previewIds = manualOrder.length ? manualOrder.filter(id => ordered.includes(id)) : ordered;
  drawPreview();
}
let manualOrder = [];
function drawPreview(){
  const byId = {};
  currentCatalog().entries.forEach(e => { byId[e.id] = e; });
  $("preview").innerHTML = previewIds.map((id, i) => {
    const e = byId[id] || {};
    return `<li class="${i === previewSel ? "pick" : ""}" data-i="${i}">
      <span class="idx">${i + 1}</span><span class="name">${esc(id)}</span>
      ${e.owned_by ? `<span class="chip">${esc(e.owned_by)}</span>` : ""}
    </li>`;
  }).join("");
}
function move(delta){
  if (previewSel < 0) return;
  const to = delta === "home" ? 0 : previewSel + delta;
  if (to < 0 || to >= previewIds.length) return;
  const id = previewIds.splice(previewSel, 1)[0];
  previewIds.splice(to, 0, id);
  previewSel = to;
  manualOrder = previewIds.slice();
  drawPreview();
}

/* ---- 事件 ---- */
$("strategy").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  state.strategy = b.dataset.v; markDirty(); renderAll();
});
$("cs").addEventListener("change", ev => { state.caseSensitive = ev.target.checked; markDirty(); renderAll(); });

$("newPattern").addEventListener("keydown", ev => { if (ev.key === "Enter") $("btnAdd").click(); });
$("btnAdd").addEventListener("click", () => {
  const v = $("newPattern").value.trim(); if (!v) return;
  state.order.push(v); $("newPattern").value = ""; markDirty(); renderRules(); schedulePreview(0);
});
$("btnTop").addEventListener("click", () => {
  const v = $("newPattern").value.trim(); if (!v) return;
  state.order.unshift(v); $("newPattern").value = ""; markDirty(); renderRules(); schedulePreview(0);
});

$("rules").addEventListener("input", ev => {
  const i = ev.target.dataset && ev.target.dataset.i;
  if (i === undefined || ev.target.tagName !== "INPUT") return;
  state.order[+i] = ev.target.value; markDirty(); schedulePreview(350);
});
$("rules").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const i = +b.dataset.i, act = b.dataset.act;
  if (act === "del") state.order.splice(i, 1);
  if (act === "up" && i > 0) { [state.order[i - 1], state.order[i]] = [state.order[i], state.order[i - 1]]; }
  if (act === "down" && i < state.order.length - 1) { [state.order[i + 1], state.order[i]] = [state.order[i], state.order[i + 1]]; }
  markDirty(); renderRules(); renderModels(); schedulePreview(0);
});

$("models").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const id = b.dataset.id;
  const rule = b.dataset.act === "exact" ? id : (id.split("-")[0] + "-*");
  if (state.order.includes(rule)) { toast("", "规则已存在: " + rule); return; }
  state.order.push(rule);
  markDirty(); renderRules(); renderModels(); schedulePreview(0);
  toast("ok", "已加规则 " + rule);
});
$("filter").addEventListener("input", () => renderModels());
$("port").addEventListener("change", ev => { port = ev.target.value; manualOrder = []; previewSel = -1; renderAll(); });

$("preview").addEventListener("click", ev => {
  const li = ev.target.closest("li"); if (!li || !li.dataset.i) return;
  previewSel = +li.dataset.i; drawPreview();
});
$("pvUp").addEventListener("click", () => move(-1));
$("pvDown").addEventListener("click", () => move(1));
$("pvHome").addEventListener("click", () => move("home"));

$("btnDefault").addEventListener("click", () => {
  state.order = state.suggestedOrder.slice(); manualOrder = []; markDirty(); renderAll(); toast("ok", "已填入推荐模板,保存后生效");
});
$("btnGen").addEventListener("click", () => {
  if (!previewIds.length) { toast("err", "预览为空,先生成预览"); return; }
  state.order = previewIds.slice(); manualOrder = []; markDirty(); renderAll();
  toast("ok", `已按预览生成 ${state.order.length} 条精确规则,保存后生效`);
});
$("btnSave").addEventListener("click", async () => {
  const body = { strategy: state.strategy, case_sensitive: state.caseSensitive };
  body.order = state.order.filter(p => p && p.trim()).map(p => p.trim());
  if (!body.order.length) body.order = null; // null 让 CPA 删除该键,即不分组
  try {
    await call(PLUGIN_CONFIG_PATH, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    state.configured = !!body.order;
    markClean(state.configured);
    toast("ok", "已写入 config.yaml 并热更新");
  } catch (e) { toast("err", "保存失败: " + e.message); }
});

async function boot(){
  if(window.__moThemeSync) window.__moThemeSync();
  $("apiPath").textContent = API;
  try { await load(); }
  catch (e) { toast("err", e.message); if (!getKey()) showAuth(); }
}
boot();
</script>
</body>
</html>
